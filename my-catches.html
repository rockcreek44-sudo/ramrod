<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2° Baits - My Catches</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="app-shell">
        <section class="home-screen">
            <p class="field-label">MY CATCHES</p>
            <p class="memory-text">Remember every fish.</p>

            <hr>

<h2>LAST CATCH</h2>
<p id="lastCatch">No catches logged yet.</p>

            <hr>

<h2>BIGGEST FISH</h2>
<p id="biggestFish">No catches logged yet.</p>

<hr>

<h2>TOTAL FISH</h2>
<p id="totalFish">0</p>

            <hr>

   <h2>TOP LURE</h2>
<p id="topLure">No catches logged yet.</p>

<hr>
<h2>TOP WATER</h2>
<p id="topWater">No water data yet.</p>

           <hr>
            <h2>RECENT CATCHES</h2>
<select id="waterFilter">
    <option value="all">ALL WATERS</option>
</select>
            <p id="recentCatches">No catches logged yet.</p>

<hr>
            <hr>
<button class="enter-button" type="button" onclick="window.location.href='set-the-hook.html'">
LOG ANOTHER CATCH
</button>
            <br>
        
       <button style="margin-top: 12px;" class="enter-button" type="button" onclick="window.location.href='dashboard.html'">
  BACK TO DASHBOARD
</button>

<button id="backupCatches" style="margin-top: 12px;" class="enter-button" type="button">
    BACK UP CATCHES
</button>
         <button style="margin-top: 12px;" class="enter-button" type="button" onclick="const saved=JSON.parse(localStorage.getItem('twoDegreeBaitsCatches')||'[]');if(saved.length&&confirm('Delete the last catch?')){saved.pop();localStorage.setItem('twoDegreeBaitsCatches',JSON.stringify(saved));window.location.reload();}">
DELETE LAST CATCH
</button>
            <button style="margin-top: 12px;" class="enter-button" type="button" onclick="if(confirm('Are you sure? This will delete all catches.')){localStorage.removeItem('twoDegreeBaitsCatches');window.location.href='my-catches.html';}">CLEAR ALL CATCHES
</button>
        </section>
    </main>
<script src="script.js?v=20260728-1"></script>
</body>
</html>
