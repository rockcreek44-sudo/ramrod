<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2° Baits - My Trips</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="app-shell">
        <section class="home-screen">
            <p class="field-label">MY TRIPS</p>
            <p class="memory-text">Remember every trip.</p>

            <hr>
            <button style="margin-top: 12px;" class="enter-button" type="button" id="startTripButton">
    START TRIP
</button>
            <button style="margin-top: 12px;" class="enter-button" type="button" id="endTripButton">
    END TRIP
</button>
            

            <h2>TRIP HISTORY</h2>
            <p id="tripHistory">No trips logged yet.</p>

            <hr>

            <button style="margin-top: 12px;" class="enter-button" type="button" onclick="window.location.href='dashboard.html'">
                BACK TO DASHBOARD
            </button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
